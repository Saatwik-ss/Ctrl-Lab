# Baseline A: Parameter-Matched Causal Transformer Decoder
experiment:
  name: "baseline_causal_transformer"
  seed: 42
  device: "cuda"

audio:
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80

model:
  type: "transformer"
  mel_bins: 80
  model_dim: 256
  num_layers: 6
  nhead: 4
  latent_dim: 64
  spk_dim: 192

training:
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 0.01
